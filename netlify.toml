[build]
  command = "npm install && cd frontend && npm run build"
  publish = "frontend/build"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm install && cd frontend && npm run build"

[context.deploy-preview]
  command = "npm install && cd frontend && npm run build"

[context.branch-deploy]
  command = "npm install && cd frontend && npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
